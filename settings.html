<div
    id="chromatic-images-settings"
    class="chromatic-images-settings"
>
    <div class="inline-drawer">
        <button
            id="chromatic-images-drawer-toggle"
            class="inline-drawer-toggle inline-drawer-header chromatic-images-drawer-toggle"
            type="button"
            aria-controls="chromatic-images-drawer-content"
            aria-expanded="false"
        >
            <b>Chromatic Images</b>
            <span
                class="inline-drawer-icon fa-solid fa-circle-chevron-down down"
                aria-hidden="true"
            ></span>
        </button>
        <div
            id="chromatic-images-drawer-content"
            class="inline-drawer-content"
        >
            <p class="chromatic-images-description">
                Context-aware image proposals and generation for SillyTavern roleplay.
            </p>
            <section
                id="chromatic-images-status-section"
                class="chromatic-images-status-section"
                aria-labelledby="chromatic-images-status-heading"
            >
                <h3
                    id="chromatic-images-status-heading"
                    class="chromatic-images-status-title"
                >
                    Development status
                </h3>
                <p class="chromatic-images-status-text">
                    Chromatic Images is installed correctly.
                    Image proposals and generation are not enabled in this milestone.
                </p>
            </section>
        </div>
    </div>
</div>
